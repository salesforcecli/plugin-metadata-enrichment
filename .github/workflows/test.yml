name: tests
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC

jobs:
  yarn-lockfile-check:
    uses: salesforcecli/github-workflows/.github/workflows/lockFileCheck.yml@main
  # Since the Windows unit tests take much longer, we run the linux unit tests first and then run the windows unit tests
  linux-unit-tests:
    needs: yarn-lockfile-check
    uses: salesforcecli/github-workflows/.github/workflows/unitTestsLinux.yml@main
  windows-unit-tests:
    needs: linux-unit-tests
    uses: salesforcecli/github-workflows/.github/workflows/unitTestsWindows.yml@main
  # NUTs (integration tests) were removed along with the retired `sf metadata enrich`
  # command: this plugin is now a command-less tombstone with no *.nut.ts files, so
  # `yarn test:nuts` had nothing to run and the org-authed nuts jobs failed on
  # "No test files found". See W-23123159.
